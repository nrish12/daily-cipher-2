<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Hunt - Daily Mystery Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { 
            font-size: 3em; 
            text-align: center; 
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .status {
            text-align: center;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            margin: 20px 0;
        }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }
        .category-btn {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border: 3px solid transparent;
            transition: all 0.3s;
        }
        .category-btn:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }
        .category-btn.selected {
            border-color: #667eea;
            background: #e8eafd;
        }
        .emoji { font-size: 3em; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 CIPHER HUNT</h1>
        <p class="tagline">Think fast. Guess smart. Beat the clock.</p>
        
        <div class="status" id="status">
            Connecting to database...
        </div>

        <div id="categorySection" style="display: none;">
            <h2 style="text-align: center; margin-bottom: 20px;">Choose Your Mystery</h2>
            <div class="category-grid">
                <button class="category-btn" onclick="selectCategory('PERSON')">
                    <div class="emoji">👤</div>
                    <div>PERSON</div>
                </button>
                <button class="category-btn" onclick="selectCategory('PLACE')">
                    <div class="emoji">📍</div>
                    <div>PLACE</div>
                </button>
                <button class="category-btn" onclick="selectCategory('THING')">
                    <div class="emoji">💎</div>
                    <div>THING</div>
                </button>
            </div>
            <button onclick="startGame()" id="startBtn" style="display: none;">START HUNT</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jqjrzywgnxnmqynbfmvm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxanJ6eXdnbnhubXF5bmJmbXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzA0OTQ5NTEsImV4cCI6MjA0NjA3MDk1MX0.z1K7QDYAn4DEHQDfE5o5E3YuWLd_VD6XdbR3vRxP8SU';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let selectedCategory = null;

        async function testConnection() {
            try {
                const { data, error } = await supabase.from('mysteries').select('count');
                if (error) throw error;
                
                document.getElementById('status').innerHTML = '✅ Connected to database!<br><small>Ready to play</small>';
                document.getElementById('categorySection').style.display = 'block';
            } catch (err) {
                document.getElementById('status').innerHTML = '❌ Database connection failed<br><small>' + err.message + '</small>';
            }
        }

        function selectCategory(category) {
            selectedCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.closest('.category-btn').classList.add('selected');
            document.getElementById('startBtn').style.display = 'block';
        }

        function startGame() {
            alert('Game starting with category: ' + selectedCategory + '\n\nFull game will load here!');
        }

        testConnection();
    </script>
</body>
</html>
