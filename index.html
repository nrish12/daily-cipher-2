<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>Daily Cipher Hunt - Free Daily Mystery Puzzle Game</title>
    <meta name="title" content="Daily Cipher Hunt - Free Daily Mystery Puzzle Game">
    <meta name="description" content="Solve daily mystery puzzles! Guess the person, place, or thing with progressive clues. Free word game like Wordle. New puzzle every day.">
    <meta name="keywords" content="daily puzzle, mystery game, word game, wordle alternative, brain teaser, trivia game, free game, cipher hunt, daily challenge">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cipher-hunt.com/">
    <meta property="og:title" content="Daily Cipher Hunt - Daily Mystery Game">
    <meta property="og:description" content="Can you solve today's mystery? 8 clues, 6 attempts. Free daily puzzle game.">
    <meta property="og:image" content="https://cipher-hunt.com/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://cipher-hunt.com/">
    <meta property="twitter:title" content="Daily Cipher Hunt">
    <meta property="twitter:description" content="Solve today's mystery puzzle! 🔍">
    <meta property="twitter:image" content="https://cipher-hunt.com/twitter-card.png">

    <!-- Canonical -->
    <link rel="canonical" href="https://cipher-hunt.com/">

    <!-- Theme Color -->
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Daily Cipher Hunt",
      "description": "Free daily mystery puzzle game where you guess the person, place, or thing from progressive clues",
      "url": "https://cipher-hunt.com",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "1250"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
